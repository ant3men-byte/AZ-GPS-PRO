name: Licensing backend tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: licensing_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: test_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check backend/worker.mjs && node --test backend/tests/*.test.mjs
      - name: Apply schema and exercise license lifecycle
        run: |
          psql -h localhost -U postgres -d licensing_test -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role;'
          psql -h localhost -U postgres -d licensing_test -v ON_ERROR_STOP=1 -f backend/schema.sql
          psql -h localhost -U postgres -d licensing_test -v ON_ERROR_STOP=1 -f backend/migrations/002_security_hardening.sql
          psql -h localhost -U postgres -d licensing_test -v ON_ERROR_STOP=1 -f backend/tests/database.sql
