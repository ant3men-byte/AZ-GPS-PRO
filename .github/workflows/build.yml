name: Build AZ.GPS.PRO
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Portable math tests
        run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build iOS 12 arm64 library
        env:
          AZ_LICENSE_API_URL: ${{ vars.AZ_LICENSE_API_URL }}
          AZ_LICENSE_PUBLIC_KEY_B64: ${{ vars.AZ_LICENSE_PUBLIC_KEY_B64 }}
        run: make
      - name: Verify binary
        run: |
          file build/AZ.GPS.PRO.dylib | grep arm64
          otool -L build/AZ.GPS.PRO.dylib
          codesign --verify build/AZ.GPS.PRO.dylib
          cd build
          shasum -a 256 AZ.GPS.PRO.dylib > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AZ.GPS.PRO-arm64-ios12
          path: |
            build/AZ.GPS.PRO.dylib
            build/SHA256SUMS.txt
          if-no-files-found: error

